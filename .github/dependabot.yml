version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns: ["*"]
    cooldown:
      default-days: 7

  - package-ecosystem: bun
    directories: [/, /docs]
    schedule:
      interval: weekly
    commit-message:
      prefix: build
      prefix-development: build
    groups:
      # vitest and its browser provider must share a major; apart, the browser tests fail to start (#181, #183).
      vitest:
        patterns: ["vitest", "@vitest/*"]
      minor-and-patch:
        update-types: [minor, patch]
    # TypeScript 7 (native compiler) hangs `tsc --noEmit` here and `astro check` refuses it (#182, #184).
    # Revisit when astro check supports it.
    ignore:
      - dependency-name: typescript
        versions: [">=7"]
    cooldown:
      default-days: 7
