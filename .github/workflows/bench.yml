name: Benchmark

# Manual only: the full suite takes tens of minutes and runs on a shared CPU-only runner (SwiftShader),
# so its numbers are for comparing two runs of this workflow, never for comparing with a developer machine.
on:
  workflow_dispatch:
    inputs:
      filter:
        description: Only run cases whose id contains this text (empty runs the suite)
        required: false
        default: ""
      runs:
        description: Fresh-page runs per case
        required: false
        default: "3"

permissions:
  contents: read

jobs:
  bench:
    name: Browser benchmark (Chromium, SwiftShader)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.1
      - run: bun install --frozen-lockfile
      - run: bun install --cwd docs --frozen-lockfile
      - run: bunx playwright install --with-deps chromium
      - name: Run the suite
        env:
          BENCH_FILTER: ${{ inputs.filter }}
          BENCH_OUT: bench-results/graphraum-bench
          BENCH_RUNS: ${{ inputs.runs }}
          BENCH_SWIFTSHADER: "1"
        run: bun run bench
      - name: Summarize
        run: cat bench-results/graphraum-bench.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bench-results
          path: bench-results/
          retention-days: 30
