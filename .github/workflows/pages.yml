name: Pages

# Called by CI after a push to main has been verified and released, so the release tag exists and
# only trusted main commits are ever checked out. Maintainers can also run it by hand.
on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.1
      - name: Restore release docs cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/release-docs
          # Release builds are immutable per tag; a new tag only adds a directory.
          key: release-docs-v1-${{ hashFiles('docs/scripts/build-release-archives.ts', 'docs/src/lib/release-archive.ts') }}-${{ github.sha }}
          restore-keys: |
            release-docs-v1-${{ hashFiles('docs/scripts/build-release-archives.ts', 'docs/src/lib/release-archive.ts') }}-
      - name: Build stable and next documentation
        run: bun run docs:archive
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: .pages

  deploy:
    needs: build
    if: needs.build.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
