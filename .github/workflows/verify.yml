name: Verify

# Commit lint, lint and types always; unit tests, build and docs when the caller says they are affected.
on:
  workflow_call:
    inputs:
      code:
        description: Library, examples or build setup changed
        type: boolean
        default: true
      docs:
        description: Docs changed, or code the docs playground imports
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.1
      - run: bun install --frozen-lockfile
      - if: inputs.docs
        run: bun install --cwd docs --frozen-lockfile
      - name: Validate PR title
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        # A squash merge appends " (#N)" to the title, and that header must pass on main too.
        run: printf '%s (#%s)\n' "$PR_TITLE" "$PR_NUMBER" | bunx commitlint --verbose
      - name: Validate PR commits
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: bunx commitlint --from "$BASE_SHA" --to "$HEAD_SHA" --verbose
      - name: Validate pushed commit
        if: github.event_name == 'push'
        run: bunx commitlint --last --verbose
      - run: bun run check
      - if: inputs.code
        run: bun run test
      - if: inputs.code
        run: bun run build
      - if: inputs.docs
        run: bun run docs:check
      - if: inputs.docs
        run: bun run docs:test
      - if: inputs.docs
        run: bun run docs:build
