<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>graphraum streaming</title>
		<style>
			html,
			body,
			#graph {
				margin: 0;
				width: 100%;
				height: 100%;
				overflow: hidden;
				background: #0b0d14;
				font-family: ui-sans-serif, system-ui, sans-serif;
			}
			#panel {
				position: absolute;
				z-index: 1;
				top: 12px;
				left: 14px;
				width: 260px;
				padding: 12px 14px;
				border-radius: 10px;
				background: rgb(18 21 31 / 0.88);
				border: 1px solid rgb(255 255 255 / 0.08);
				color: #c9cfdb;
				font-size: 12px;
				display: grid;
				gap: 8px;
			}
			#panel label {
				display: grid;
				grid-template-columns: 1fr auto;
				gap: 2px 8px;
				align-items: center;
			}
			#panel input[type="range"] {
				grid-column: 1 / -1;
				width: 100%;
			}
			#panel output {
				font: 11px ui-monospace, monospace;
				color: #8b93a5;
			}
			#panel .row {
				display: flex;
				gap: 6px;
			}
			#panel button {
				flex: 1;
				padding: 6px 8px;
				border-radius: 6px;
				border: 1px solid rgb(255 255 255 / 0.12);
				background: rgb(255 255 255 / 0.06);
				color: inherit;
				font: inherit;
				cursor: pointer;
			}
			#panel button[aria-pressed="true"] {
				background: #8b7bff;
				border-color: #8b7bff;
				color: #0b0d14;
			}
			#status {
				font: 11px ui-monospace, monospace;
				color: #8b93a5;
				white-space: pre;
			}
		</style>
	</head>
	<body>
		<div id="panel">
			<div class="row">
				<button id="view-cluster" type="button">Groups</button>
				<button id="view-flat" type="button">Nodes</button>
			</div>
			<label>Nodes per batch <output id="batch-out"></output><input id="batch" type="range" min="25" max="2000" step="25" /></label>
			<label>Batch every (ms) <output id="every-out"></output><input id="every" type="range" min="16" max="1000" step="4" /></label>
			<label>Grow in (ms) <output id="enter-out"></output><input id="enter" type="range" min="0" max="1500" step="10" /></label>
			<label>Group glide (ms) <output id="glide-out"></output><input id="glide" type="range" min="0" max="2000" step="10" /></label>
			<label>Regroup every (ms) <output id="regroup-out"></output><input id="regroup" type="range" min="100" max="3000" step="50" /></label>
			<label><span>Camera follows growth</span><input id="follow" type="checkbox" /></label>
			<div class="row">
				<button id="restart" type="button">Restart</button>
				<button id="pause" type="button">Pause</button>
			</div>
			<div id="status">starting</div>
		</div>
		<div id="graph"></div>
		<script type="module" src="./main.ts"></script>
	</body>
</html>
